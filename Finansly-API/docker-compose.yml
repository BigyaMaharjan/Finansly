services:
  api:
    build:
      context: .
      dockerfile: Finansly.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ledgerly_db;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerly_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finansly_pgdata:/var/lib/postgresql/data

volumes:
  finansly_pgdata:
