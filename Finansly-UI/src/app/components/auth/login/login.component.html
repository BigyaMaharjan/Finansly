<div class="login-container">
  <div class="login-card" #loginCard>
    <h2 #heading>Login</h2>

    @if (error) {
      <div class="error-message" #errorBlock>{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group" #emailGroup>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          email
          (focus)="onInputFocus($event)"
          (blur)="onInputBlur($event)"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          (focus)="onInputFocus($event)"
          (blur)="onInputBlur($event)"
        />
      </div>

      <button type="submit" [disabled]="loading" #loginBtn (click)="onRipple($event)">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="register-link" #registerLink>
      Don't have an account? <a routerLink="/auth/register">Register</a>
    </p>
  </div>
</div>
