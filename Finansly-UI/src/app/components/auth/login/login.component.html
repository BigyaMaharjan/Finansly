<div class="login-container">
  <app-navbar class="navbar-container"></app-navbar>

  <div class="login-card" #loginCard>
    <h2 #heading>Finansly</h2>

    @if (error) {
      <div class="error-message" #errorBlock>{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group" #emailGroup>
        <label for="email">Email</label>
        <div class="input-wrapper">
          <span class="material-icons">person</span>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            email
            (focus)="onInputFocus($event)"
            (blur)="onInputBlur($event)"
          />
        </div>
      </div>

      <div class="form-group" #passwordGroup>
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="material-icons">lock</span>
          <input
            #passwordInput
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            (focus)="onInputFocus($event)"
            (blur)="onInputBlur($event)"
          />
          <button type="button" class="eye-toggle" (click)="togglePassword()">
            <span class="material-icons">{{ showPassword ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="loading" #loginBtn (click)="onRipple($event)">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="register-link" #registerLink>
      Don't have an account? <a routerLink="/auth/register">Register</a>
    </p>
  </div>
</div>
